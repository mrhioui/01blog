# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate properties
# Default 'update' keeps local/dev convenient; set SPRING_JPA_DDL_AUTO=validate (or none)
# in staging/production so the schema is never auto-mutated against a real database.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload limits (for images/videos)
# Overridable via env; lower this to reduce the storage-exhaustion / DoS surface.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:25MB}
app.upload-dir=uploads

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.springframework.security=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
