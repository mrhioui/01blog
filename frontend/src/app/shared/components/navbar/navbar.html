<nav class="navbar navbar-expand-lg app-navbar px-3 px-lg-4 py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-3 me-0" routerLink="/">
      <span class="brand__mark">01</span>
      <span class="d-flex flex-column">
        <strong class="brand__title">01Blog</strong>
      </span>
    </a>

    <button
      class="navbar-toggler app-navbar-toggler"
      type="button"
      aria-controls="mainNavbarMenu"
      [attr.aria-expanded]="!isMenuCollapsed()"
      aria-label="Toggle navigation"
      (click)="isMenuCollapsed.set(!isMenuCollapsed())"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse mt-3 mt-lg-0" id="mainNavbarMenu" [ngbCollapse]="isMenuCollapsed()">
      <div *ngIf="isLoggedIn()" class="navbar-search mx-lg-3 my-3 my-lg-0">
        <i class="bi bi-search search-icon"></i>
        <input
          class="form-control navbar-search-input"
          type="search"
          placeholder="Search users"
          [value]="searchQuery()"
          (input)="onSearchInput($any($event.target).value)"
          (focus)="searchOpen.set(true)"
          (blur)="closeSearch()"
        />

        <div *ngIf="searchOpen() && (searchQuery().trim().length >= 2 || searchLoading())" class="search-results shadow">
          <div *ngIf="searchLoading()" class="search-state">Searching...</div>

          <button
            *ngFor="let user of searchResults()"
            type="button"
            class="search-result"
            (mousedown)="selectUser(user)"
          >
            <span class="search-avatar">{{ user.username.charAt(0).toUpperCase() }}</span>
            <span class="search-copy">
              <strong>{{ user.username }}</strong>
              <small>{{ user.email }}</small>
            </span>
          </button>

          <div *ngIf="!searchLoading() && !searchResults().length" class="search-state">No users found</div>
        </div>
      </div>

      <div class="navbar-nav ms-lg-auto align-items-lg-center gap-2">
        <a
          class="btn app-nav-btn"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="isMenuCollapsed.set(true)"
        >
          Feed
        </a>

        <a
          *ngIf="!isLoggedIn()"
          class="btn app-nav-btn"
          routerLink="/login"
          routerLinkActive="active"
          (click)="isMenuCollapsed.set(true)"
        >
          Login
        </a>

        <a
          *ngIf="!isLoggedIn()"
          class="btn app-nav-btn"
          routerLink="/register"
          routerLinkActive="active"
          (click)="isMenuCollapsed.set(true)"
        >
          Register
        </a>

        <a
          *ngIf="isLoggedIn()"
          class="btn app-nav-btn mx-2 px-5"
          (click)="openCreatePostModal()"
        >
          <i class="bi bi-plus-lg me-2"></i>
          Create Post
        </a>

        <div *ngIf="isLoggedIn()" ngbDropdown class="nav-item dropdown notification-dropdown" (openChange)="$event && loadNotifications()">
          <button
            class="btn app-nav-btn icon-nav-btn position-relative"
            type="button"
            id="notificationMenu"
            ngbDropdownToggle
            aria-label="Notifications"
          >
            <i class="bi bi-bell"></i>
            <span *ngIf="notificationCount()" class="notification-badge">{{ notificationCount() }}</span>
          </button>

          <div ngbDropdownMenu aria-labelledby="notificationMenu" class="dropdown-menu dropdown-menu-end notification-menu shadow">
            <div class="notification-header d-flex justify-content-between align-items-center">
              <strong>Notifications</strong>
              <button *ngIf="notificationCount() > 0" class="btn btn-link btn-sm p-0" (click)="$event.stopPropagation(); markAllAsRead()">Mark all as read</button>
            </div>
            
            <div *ngIf="loadingNotifications()" class="notification-loading text-center p-3">
              <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            </div>

            <div *ngIf="!loadingNotifications() && notifications().length > 0" class="notification-list">
              <button
                *ngFor="let notification of notifications()"
                class="notification-item"
                [class.unread]="!notification.isRead"
                (click)="onNotificationClick(notification)"
              >
                <div class="notification-content">
                  <span class="notification-message">{{ notification.message }}</span>
                  <small class="notification-time text-muted">{{ notification.timestamp | date:'short' }}</small>
                </div>
                <div *ngIf="!notification.isRead" class="unread-dot"></div>
              </button>
            </div>

            <div *ngIf="!loadingNotifications() && !notifications().length" class="notification-empty">
              <i class="bi bi-bell-slash"></i>
              <span>No notifications yet</span>
            </div>
          </div>
        </div>

        <div *ngIf="isLoggedIn()" ngbDropdown class="nav-item dropdown profile-dropdown ms-lg-2">
          <button
            class="btn app-nav-btn profile-toggle dropdown-toggle"
            type="button"
            id="profileMenu"
            ngbDropdownToggle
          >
            <span class="profile-name">{{ currentUser()?.username }}</span>
          </button>

          <div ngbDropdownMenu aria-labelledby="profileMenu" class="dropdown-menu dropdown-menu-end profile-menu">
            <a
              *ngIf="isAdmin()"
              ngbDropdownItem
              routerLink="/admin/dashboard"
              (click)="isMenuCollapsed.set(true)"
            >
              <i class="bi bi-speedometer2 me-2"></i>
              Admin dashboard
            </a>
            <a ngbDropdownItem routerLink="/profile" (click)="isMenuCollapsed.set(true)">
              <i class="bi bi-person-circle me-2"></i>
              Profile
            </a>
            <div class="dropdown-divider"></div>
            <button ngbDropdownItem type="button" class="logout-item" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
