<section class="row g-4 justify-content-center">

  <div class="col-12 col-lg-9 col-xl-7">
    <div class="card border-0 shadow-sm dashboard-card">
      <div class="card-body p-4">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
          <div>
            <div class="small text-uppercase fw-semibold section-kicker mb-1">Feed</div>
            <h2 class="h3 mb-0">Latest learning posts</h2>
          </div>
          <span class="badge rounded-pill count-badge">{{ posts().length }} items</span>
        </div>

        <div *ngIf="loadingPosts()" class="alert app-alert mb-0">Loading posts...</div>

        <div *ngIf="!loadingPosts() && posts().length" class="d-grid gap-3">
          <app-post-card *ngFor="let post of posts()" [post]="post"></app-post-card>
        </div>

        <div *ngIf="!isLastPage() && posts().length" class="mt-4 text-center">
          <button (click)="loadMorePosts()" class="btn btn-outline-primary" [disabled]="loadingMore()">
            <span *ngIf="loadingMore()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ loadingMore() ? 'Loading more...' : 'Load more posts' }}
          </button>
        </div>

        <div *ngIf="!loadingPosts() && !posts().length" class="alert app-alert mb-0">
          No posts are available yet. Once members start publishing, their updates will appear here.
        </div>
      </div>
    </div>
  </div>
</section>
