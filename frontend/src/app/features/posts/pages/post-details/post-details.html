<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/" class="text-decoration-none">Feed</a></li>
          <li class="breadcrumb-item active" aria-current="page">Post Details</li>
        </ol>
      </nav>

      <div *ngIf="loading()" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading post...</p>
      </div>

      <div *ngIf="errorMessage()" class="alert alert-danger shadow-sm border-0">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage() }}
        <div class="mt-3">
          <a routerLink="/" class="btn btn-outline-danger rounded-pill px-4 btn-sm">Back to Feed</a>
        </div>
      </div>

      <div *ngIf="!loading() && post() as p">
        <app-post-card
          [post]="p"
          (postUpdated)="onPostUpdated($event)"
          (postDeleted)="onPostDeleted()"
        ></app-post-card>
      </div>
    </div>
  </div>
</div>
