<section class="container">
  <div class="row justify-content-center align-items-center min-vh-80 py-4">
    <div class="col-12 col-xl-10">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden auth-card">
        <div class="row g-0">
          <!-- Form Side -->
          <div class="col-12 col-lg-6 p-4 p-md-5 d-flex flex-column justify-content-center bg-white order-2 order-lg-1">
            <div class="mb-4">
              <h2 class="fw-bold display-6 auth-title">Create Account</h2>
              <p class="text-muted">Join the 01Blog student community</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="form-floating mb-3">
                <input 
                  type="text" 
                  class="form-control auth-input"
                  [class.is-invalid]="isInvalid('username')"
                  id="usernameRegister" 
                  formControlName="username" 
                  placeholder="john_doe"
                />
                <label for="usernameRegister">Username</label>
                <div *ngIf="isInvalid('username')" class="invalid-feedback">
                  {{ controlError('username') }}
                </div>
              </div>

              <div class="form-floating mb-3">
                <input 
                  type="email" 
                  class="form-control auth-input"
                  [class.is-invalid]="isInvalid('email')"
                  id="emailRegister" 
                  formControlName="email" 
                  placeholder="name@example.com"
                />
                <label for="emailRegister">Email address</label>
                <div *ngIf="isInvalid('email')" class="invalid-feedback">
                  {{ controlError('email') }}
                </div>
              </div>

              <div class="form-floating mb-4">
                <input 
                  type="password" 
                  class="form-control auth-input"
                  [class.is-invalid]="isInvalid('password')"
                  id="passwordRegister" 
                  formControlName="password" 
                  placeholder="••••••••"
                />
                <label for="passwordRegister">Password (min 6 characters)</label>
                <div *ngIf="isInvalid('password')" class="invalid-feedback">
                  {{ controlError('password') }}
                </div>
              </div>

              <div *ngIf="errorMessage()" class="alert alert-danger border-0 rounded-3 py-2 small mb-3">
                <i class="bi bi-exclamation-circle me-2"></i>{{ errorMessage() }}
              </div>
              
              <div *ngIf="createdUser() as user" class="alert alert-success border-0 rounded-4 p-3 mb-4 small shadow-sm">
                <div class="fw-bold mb-2 text-uppercase" style="color: var(--dark-amaranth)">Account Created!</div>
                <div class="opacity-75">
                  <p class="mb-1"><strong>Username:</strong> {{ user.username }}</p>
                  <p class="mb-0"><strong>Email:</strong> {{ user.email }}</p>
                </div>
                <div class="mt-3">
                  <a routerLink="/login" class="btn btn-sm app-btn-primary rounded-pill px-3">Login Now</a>
                </div>
              </div>

              <button class="btn btn-lg w-100 app-btn-primary mb-4" type="submit" [disabled]="submitting()">
                {{ submitting() ? 'Creating account...' : 'Create Account' }}
              </button>

              <div class="text-center">
                <p class="small text-muted mb-0">
                  Already have an account? 
                  <a routerLink="/login" class="auth-link fw-bold">Login here</a>
                </p>
              </div>
            </form>
          </div>

          <!-- Image Side -->
          <div class="col-12 col-lg-6 d-none d-lg-block auth-image-container h-100 order-1 order-lg-2">
            <img src="/auth-register.png" alt="Register Illustration" class="img-fluid h-100 w-100 object-fit-cover d-block" />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
