<section class="container">
  <div class="row justify-content-center align-items-center min-vh-80 py-5">
    <div class="col-12 col-xl-10">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden auth-card">
        <div class="row g-0">
          <!-- Form Side -->
          <div class="col-12 col-lg-6 p-4 p-md-5 d-flex flex-column justify-content-center bg-white">
            <div class="mb-4">
              <h2 class="fw-bold display-6 auth-title">Welcome Back</h2>
              <p class="text-muted">Sign in to continue your blogging journey</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="form-floating mb-3">
                <input type="text" class="form-control auth-input" id="usernameInput" formControlName="username"
                  placeholder="john_doe" />
                <label for="usernameInput">Username</label>
              </div>

              <div class="form-floating mb-4">
                <input type="password" class="form-control auth-input" id="passwordInput" formControlName="password"
                  placeholder="••••••••" />
                <label for="passwordInput">Password</label>
              </div>

              <div *ngIf="errorMessage()" class="alert alert-danger border-0 rounded-3 py-2 small mb-3">
                <i class="bi bi-exclamation-circle me-2"></i>{{ errorMessage() }}
              </div>

              <button class="btn btn-lg w-100 app-btn-primary mb-4" type="submit" [disabled]="submitting()">
                {{ submitting() ? 'Signing in...' : 'Sign In' }}
              </button>

              <div class="text-center">
                <p class="small text-muted mb-0">
                  Don't have an account?
                  <a routerLink="/register" class="auth-link fw-bold">Register here</a>
                </p>
              </div>
            </form>
          </div>

          <!-- Image Side -->
          <div class="col-12 col-lg-6 d-none d-lg-block auth-image-container h-100">
            <img src="/auth-login.png" alt="Login Illustration" class="img-fluid h-100 w-100 object-fit-cover d-block" />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
