<section class="card border-0 shadow-sm admin-page">
  <div class="card-body p-4 p-lg-5">
    <div class="small text-uppercase fw-semibold page-kicker mb-2">Admin Panel</div>
    <h1 class="h2 mb-3">User Management</h1>

    <ng-container *ngIf="isAdmin(); else restrictedState">
      <div *ngIf="!users() || users().length === 0" class="alert alert-info mb-4">No users found.</div>

      <div *ngIf="users() && users().length > 0" class="table-responsive">
        <table class="table table-striped table-hover admin-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Username</th>
              <th scope="col">Email</th>
              <th scope="col">Role</th>
              <th scope="col">Status</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users(); let i = index">
              <th scope="row">{{ i + 1 }}</th>
              <td>{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.role }}</td>
              <td>{{ user.banned ? 'Banned' : 'Active' }}</td>
              <td>
                <div *ngIf="user.id !== currentUser()?.id; else selfActions">
                  <button *ngIf="!user.banned" class="btn btn-sm btn-warning me-1" (click)="banUser(user.id)">Ban</button>
                  <button *ngIf="user.banned" class="btn btn-sm btn-success me-1" (click)="unbanUser(user.id)">Unban</button>
                  <button class="btn btn-sm btn-danger" (click)="deleteUser(user.id)">Delete</button>
                </div>
                <ng-template #selfActions>
                  <span class="badge bg-info text-dark">You</span>
                </ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <ng-template #restrictedState>
      <p class="mb-0 text-secondary">
        You do not have administrator privileges to access this page.
        <a routerLink="/">Back to feed</a>
      </p>
    </ng-template>
  </div>
</section>
